#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
# Kotlin/Native compiler daemon heap - the linkDebugFramework/linkReleaseFramework tasks
# run a separate JVM for the Kotlin/Native compiler backend (LLVM IR generation/caching)
# which is not covered by org.gradle.jvmargs or kotlin.daemon.jvmargs above. Compose
# Multiplatform's material-icons-extended module is large enough to blow the default
# heap for this JVM during framework linking on CI, causing
# "OutOfMemoryError: Java heap space" in :composeApp:linkDebugFrameworkIosArm64 /
# linkDebugFrameworkIosSimulatorArm64. Raise it explicitly.
kotlin.native.jvmArgs=-Xmx4096M
#Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
#Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true