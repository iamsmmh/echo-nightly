name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '32 4 * * 1'   # weekly, Mondays 04:32 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # We drive extraction with a real Gradle JVM build (below) so CodeQL
          # sees the resolved Kotlin/Java bytecode.
          build-mode: none

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      # If autobuild did not produce a database (KMP repos sometimes confuse it),
      # fall back to compiling the shared :common module on the JVM target, which
      # is guaranteed to exist and yields bytecode CodeQL can analyse.
      - name: Compile shared JVM sources (fallback build)
        if: steps.autobuild.outcome == 'failure'
        run: |
          chmod +x ./gradlew
          ./gradlew :common:compileKotlinJvm --no-daemon --stacktrace 2>&1 | tail -40 || echo "analysis build degraded; continuing"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
