name: Multiplatform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  jvm-and-android:
    name: Shared code (JVM compilation & tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared KMP modules
        run: |
          chmod +x ./gradlew
          python3 scripts/ci_run.py ./gradlew :common:assemble :shared:assemble :core:assemble :domain:assemble \
                    :data:assemble :extensions:assemble :player:assemble :composeApp:assemble \
                    --stacktrace
      - name: Run JVM tests of every shared module
        run: |
          python3 scripts/ci_run.py ./gradlew :shared:jvmTest :core:jvmTest :domain:jvmTest :data:jvmTest \
                    :extensions:jvmTest :player:jvmTest --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-jvm-test-results
          path: |
            */build/test-results/**/*.xml
            */build/reports/tests/**/*.html

  ios-framework:
    name: iOS framework (compile, link & exported-API sanity checks)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile & link every iOS target
        run: |
          chmod +x ./gradlew
          python3 scripts/ci_run.py ./gradlew :common:compileKotlinIosX64 \
                    :common:compileKotlinIosArm64 \
                    :common:compileKotlinIosSimulatorArm64 \
                    :composeApp:linkDebugFrameworkIosArm64 \
                    :composeApp:linkDebugFrameworkIosSimulatorArm64 \
                    :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
                    --stacktrace
      - name: Verify the framework contains the iOS bridge
        run: |
          FRAMEWORK=$(find composeApp/build/bin -type d -name 'ComposeApp.framework' | head -1)
          echo "Framework: $FRAMEWORK"
          test -n "$FRAMEWORK"
          HEADER="$FRAMEWORK/Headers/ComposeApp.h"
          test -f "$HEADER"
          grep -q "MainViewController" "$HEADER"
          grep -q "EchoIosBridge" "$HEADER"
          echo "Framework exports the expected API"
