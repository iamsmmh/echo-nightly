name: Security

# Supplemental automated security checks:
#  - dependency-review on pull requests (blocks PRs that add a vulnerable dep)
#  - Gitleaks secret scanning on every push to main + weekly
#  - scheduled O/S vulnerability scan of the dependency tree
#
# Native GitHub secret scanning should also be enabled in the repo settings;
# this workflow is defense-in-depth on top of it. See SECURITY.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '21 3 * * 1'   # weekly, Mondays 03:21 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # GitHub's dependency-review-action requires the repository's Dependency
  # graph to be enabled (Settings → Code security). This repo cannot enable it
  # from code, so the job only runs once an admin has (a) enabled the
  # Dependency graph and (b) set the repository variable
  # DEPENDENCY_REVIEW_ENABLED=true. Skipped by default, so it never blocks.
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Review changed dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Defense-in-depth secret scan. GitHub's native secret scanning (Settings →
  # Code security) is the authoritative always-on gate; this Gitleaks job scans
  # the full repository history and reports findings. It is intentionally
  # non-blocking: pre-existing history entries (not introduced by a PR) can
  # otherwise hold the pipeline hostage. New live secrets flagged here should
  # be rotated and confirmed against native secret scanning.
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /src --no-banner --redact --verbose || true
          # --verbose prints each finding (file:line, redacted) to the log;
          # || true keeps this supplemental scan from blocking the pipeline.

  dependency-vulnerabilities:
    name: O/S dependency vulnerability scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      # Best effort: osv-scanner understands Gradle/Kotlin partially (it needs a
      # resolved dependency graph). Dependabot is the authoritative scanner for
      # our Gradle tree; this job reports whatever OSV can derive and must not
      # block the pipeline on tooling limitations.
      - name: Run OSV-Scanner
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:latest \
            scan --recursive /src || echo "OSV scan reported issues or lacked a parseable graph; see Dependabot."
