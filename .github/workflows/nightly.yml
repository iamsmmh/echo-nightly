name: nightly

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
      SIGNING_PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          SHORT=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          {
            echo "VERSION=$SHORT"
            echo "COMMIT<<__COMMIT__"
            echo "$MSG"
            echo "__COMMIT__"
          } >> "$GITHUB_ENV"

      - name: Cook KeyStore (optional)
        if: env.KEYSTORE_B64 != '' && env.SIGNING_PASSWORD != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"
          echo "SIGNING_KEYSTORE=$GITHUB_WORKSPACE/signing-key.jks" >> "$GITHUB_ENV"

      - name: Cook Google Services (optional)
        if: env.GOOGLE_SERVICES_B64 != ''
        run: echo "$GOOGLE_SERVICES_B64" | base64 -d > app-android/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "${SIGNING_KEYSTORE:-}" ] && [ -s "${SIGNING_KEYSTORE:-/nonexistent}" ]; then
            ARGS+=(
              "-Pandroid.injected.signing.store.file=$SIGNING_KEYSTORE"
              "-Pandroid.injected.signing.store.password=$SIGNING_PASSWORD"
              "-Pandroid.injected.signing.key.alias=key0"
              "-Pandroid.injected.signing.key.password=$SIGNING_PASSWORD"
            )
            echo "Signing nightly build"
          else
            echo "::notice::No signing secrets configured - building unsigned nightly"
          fi
          python3 scripts/ci_run.py ./gradlew :app-android:assembleNightly "${ARGS[@]}" --stacktrace

      - name: Resolve APK
        # AGP names the output app-nightly.apk when signed and
        # app-nightly-unsigned.apk otherwise; resolve whichever exists.
        run: |
          python3 scripts/android_artifact.py --variant nightly --type apk \
            --destination "app-android/build/${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-nightly-${{ env.VERSION }}
          path: app-android/build/${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-nightly-log
          path: build/verification/
          if-no-files-found: ignore

      - name: Upload APK to Discord
        if: success()
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No Discord webhook configured; skipping."; exit 0; fi
          message=$(echo "@everyone **${{ env.VERSION }}**\n${{ env.COMMIT }}")
          curl -sS -F "payload_json={\"content\":\"${message}\"}" \
          -F "echo_beta=@app-android/build/${{ env.VERSION }}.apk" \
          "$WEBHOOK"

      - name: Upload APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          if [ -z "$BOT_ID" ] || [ -z "$CHANNEL_ID" ]; then echo "No Telegram secrets configured; skipping."; exit 0; fi
          regex='s/[\_\*\[\]\(\)\~\`\>\#\+\-\=\|\{\}\.\!]/\\&/g'
          message=$(printf "*Nightly Release*\n${{ env.COMMIT }}" | sed -E "$regex")
          curl -sS -F "chat_id=${CHANNEL_ID}" \
          -F "message_thread_id=${THREAD_ID}" \
          -F "document=@app-android/build/${{ env.VERSION }}.apk" \
          -F "caption=${message}" \
          -F "parse_mode=MarkdownV2" \
          https://api.telegram.org/bot${BOT_ID}/sendDocument
