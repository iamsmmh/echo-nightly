name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'common/**'
      - 'shared/**'
      - 'core/**'
      - 'domain/**'
      - 'data/**'
      - 'extensions/**'
      - 'player/**'
      - 'composeApp/**'
      - 'app-ios/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/ios.yml'
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  build:
    name: iOS framework, simulator build & unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      VERSION_NAME: "3.0.${{ github.run_number }}"
      BUILD_NUMBER: "${{ github.run_number }}"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ios-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show Xcode & simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Compile Kotlin for iOS targets
        run: |
          python3 scripts/ci_run.py ./gradlew :composeApp:compileKotlinIosArm64 \
                    :composeApp:compileKotlinIosSimulatorArm64 \
                    :composeApp:compileKotlinIosX64 \
                    :common:compileKotlinIosArm64 --stacktrace

      - name: Link debug frameworks (simulator + device)
        run: |
          python3 scripts/ci_run.py ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 \
                    :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Run shared unit tests on iOS simulator
        run: |
          # Business-logic modules only: composeApp/player K/N test binaries pull
          # the whole Compose runtime into the link step and are covered by the
          # JVM test lane instead.
          python3 scripts/ci_run.py ./gradlew :shared:iosSimulatorArm64Test :core:iosSimulatorArm64Test \
                    :domain:iosSimulatorArm64Test :data:iosSimulatorArm64Test \
                    :extensions:iosSimulatorArm64Test --stacktrace

      - name: Prepare an isolated, booted simulator
        # Reuses the same helper as the readiness pipeline: XCTest needs a fully
        # booted device (an app host cannot be installed on a shut-down one),
        # and Kotlin/Native standalone tests can leave a stale session behind.
        run: |
          ./gradlew --stop
          python3 scripts/ios_test_device.py

      - name: Build iOS app for the simulator (Xcode project build)
        run: |
          python3 scripts/ci_run.py xcodebuild -project app-ios/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            build

      - name: Run iOS host tests (XCTest, launches the app in the simulator)
        run: |
          python3 scripts/ci_run.py xcodebuild -project app-ios/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/HostTests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            test

      - name: XCTest evidence
        if: ${{ !cancelled() }}
        run: python3 scripts/xcresult_evidence.py build/HostTests.xcresult

      - name: Archive unsigned app (generic iOS device, unsigned for sideloading)
        run: |
          python3 scripts/ci_run.py xcodebuild -project app-ios/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/iosApp.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Archive did not produce an .app"; exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Echo.app
          cd build/ipa
          /usr/bin/zip -qry Echo-iOS-unsigned.ipa Payload
          cd ../..
          # Echo.app.zip artifact
          cd build/ipa/Payload
          /usr/bin/zip -qry ../../Echo-iOS-app.zip Echo.app
          cd ../../..
          unzip -t build/ipa/Echo-iOS-unsigned.ipa > /dev/null
          echo "IPA OK"
          ls -la build/ipa


      - name: Upload unsigned IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-iOS-unsigned-ipa
          path: build/ipa/Echo-iOS-unsigned.ipa
          if-no-files-found: warn

      - name: Upload Echo.app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-iOS-app
          path: build/ipa/Echo-iOS-app.zip
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-iOS-logs
          path: |
            build/DerivedData/Logs/**/*.xcactivitylog
            build/verification/
          if-no-files-found: ignore
