name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 3.0.42)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Android + unsigned iOS artifacts
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      BUILD_NUMBER: "${{ github.run_number }}"
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      SIGNING_PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Normalize version name
        run: |
          VERSION="${VERSION_NAME#v}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (build $BUILD_NUMBER)"

      - name: Run shared unit tests
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest :core:jvmTest :domain:jvmTest :data:jvmTest \
                    :extensions:jvmTest :player:jvmTest \
                    :app-android:testReleaseUnitTest --stacktrace

      - name: Build Android release APK & AAB
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"
            ARGS+=(
              "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/signing-key.jks"
              "-Pandroid.injected.signing.store.password=$SIGNING_PASSWORD"
              "-Pandroid.injected.signing.key.alias=key0"
              "-Pandroid.injected.signing.key.password=$SIGNING_PASSWORD"
            )
          else
            echo "::notice::No Android signing secrets configured - artifacts will be unsigned"
          fi
          python3 scripts/ci_run.py ./gradlew :app-android:assembleStable :app-android:bundleStable "${ARGS[@]}" --stacktrace

      - name: Rename Android artifacts
        # Resolve by variant: AGP appends "-unsigned" when no signing config is
        # applied, so a hard-coded file name breaks unsigned release runs.
        run: |
          mkdir -p dist
          python3 scripts/android_artifact.py --variant stable --type apk \
            --destination dist/Echo-Android.apk
          python3 scripts/android_artifact.py --variant stable --type aab \
            --destination dist/Echo-Android.aab
          cp dist/Echo-Android.apk "dist/Echo-Android-$VERSION_NAME.apk"
          cp dist/Echo-Android.aab "dist/Echo-Android-$VERSION_NAME.aab"
          test -f dist/Echo-Android.apk
          test -f dist/Echo-Android.aab

      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          # Phase 8 (security): a CycloneDX SBOM attached to every release.
          npx -y @cyclonedx/cdxgen -t gradle -o "dist/Echo-SBOM-$VERSION_NAME.json" . || true
          test -f "dist/Echo-SBOM-$VERSION_NAME.json" && echo "SBOM written" || echo "::warning::SBOM generation skipped"

      - name: Select an available iPhone simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/[[:space:]]*$//')
          if [ -z "$SIMULATOR" ]; then echo "No iPhone simulator found"; exit 1; fi
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Optional signing: only runs when Apple secrets are configured.
      # Without secrets the pipeline produces a valid UNSIGNED IPA which can
      # be re-signed locally (Sideloadly/AltStore) — it is NOT App Store or
      # TestFlight installable.
      # ------------------------------------------------------------------
      - name: Prepare keychain & signing identities (optional)
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          KEYCHAIN=build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Archive & package IPA
        run: |
          set -o pipefail
          if [ -n "${{ secrets.IOS_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"
            xcodebuild -project app-ios/iosApp/iosApp.xcodeproj \
              -scheme iosApp -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/iosApp.xcarchive \
              -derivedDataPath build/DerivedData \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
              CODE_SIGN_STYLE=Manual \
              MARKETING_VERSION="$VERSION_NAME" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              archive
            xcodebuild -exportArchive \
              -archivePath build/iosApp.xcarchive \
              -exportOptionsPlist <(cat <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
              ) \
              -exportPath build/export
            cp build/export/*.ipa dist/Echo-iOS-$VERSION_NAME.ipa
          else
            echo "No signing secrets configured — producing UNSIGNED IPA (not App Store installable)."
            xcodebuild -project app-ios/iosApp/iosApp.xcodeproj \
              -scheme iosApp -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/iosApp.xcarchive \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="$VERSION_NAME" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              archive
            APP_PATH=$(find build/iosApp.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
            test -n "$APP_PATH" || { echo "No .app in archive"; exit 1; }
            mkdir -p build/ipa/Payload
            cp -R "$APP_PATH" build/ipa/Payload/Echo.app
            (cd build/ipa && /usr/bin/zip -qry Echo-iOS-unsigned.ipa Payload)
            cp build/ipa/Echo-iOS-unsigned.ipa dist/Echo-iOS-unsigned.ipa
            cp dist/Echo-iOS-unsigned.ipa "dist/Echo-iOS-$VERSION_NAME-unsigned.ipa"
            unzip -t dist/Echo-iOS-unsigned.ipa > /dev/null
            test -f dist/Echo-iOS-unsigned.ipa
            echo "IPA valid"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Release-${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Echo ${{ env.VERSION_NAME }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
