name: stable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
      SIGNING_PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute commit notes
        run: |
          MSG=$(git log -1 --pretty=%s)
          {
            echo "COMMIT<<__COMMIT__"
            echo "$MSG"
            echo "__COMMIT__"
          } >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Cook KeyStore (optional)
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"

      - name: Cook Google Services (optional)
        if: env.GOOGLE_SERVICES_B64 != ''
        run: echo "$GOOGLE_SERVICES_B64" | base64 -d > app-android/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "$SIGNING_PASSWORD" ] && [ -f "$GITHUB_WORKSPACE/signing-key.jks" ]; then
            ARGS+=(
              "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/signing-key.jks"
              "-Pandroid.injected.signing.store.password=$SIGNING_PASSWORD"
              "-Pandroid.injected.signing.key.alias=key0"
              "-Pandroid.injected.signing.key.password=$SIGNING_PASSWORD"
            )
          else
            echo "::notice::No signing secrets configured - building unsigned stable"
          fi
          ./gradlew :app-android:assembleStable "${ARGS[@]}" --stacktrace
          cp app-android/build/outputs/apk/stable/app-stable.apk "app-android/build/${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-stable-${{ env.VERSION }}
          path: app-android/build/outputs/apk/stable/app-stable.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          body: ${{ env.COMMIT }}
          files: app-android/build/${{ env.VERSION }}.apk

      - name: Upload APK to Discord
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No Discord webhook configured; skipping."; exit 0; fi
          message=$(echo "@everyone **${{ env.VERSION }}**\n${{ env.COMMIT }}")
          curl -sS -F "payload_json={\"content\":\"${message}\"}" \
          -F "echo_beta=@app-android/build/${{ env.VERSION }}.apk" \
          "$WEBHOOK"

      - name: Upload APK to Telegram
        shell: bash
        env:
          BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          if [ -z "$BOT_ID" ] || [ -z "$CHANNEL_ID" ]; then echo "No Telegram secrets configured; skipping."; exit 0; fi
          regex='s/[\_\*\[\]\(\)\~\`\>\#\+\-\=\|\{\}\.\!]/\\&/g'
          message=$(printf "${{ env.COMMIT }}" | sed -E "$regex")
          curl -sS -F "chat_id=${CHANNEL_ID}" \
          -F "message_thread_id=${THREAD_ID}" \
          -F "document=@app-android/build/${{ env.VERSION }}.apk" \
          -F "caption=${message}" \
          -F "parse_mode=MarkdownV2" \
          https://api.telegram.org/bot${BOT_ID}/sendDocument
