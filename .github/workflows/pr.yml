name: pr build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: { }
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease 2>&1 | tee /tmp/ci.log

      - name: Report build errors (attach log to branch + PR comment)
        if: failure() && github.event_name == 'pull_request'
        run: |
          set -e
          LOG_NAME="ci-failure-pr-build-${{ github.run_number }}.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$GITHUB_HEAD_REF"
          git checkout -q -B log-branch "origin/$GITHUB_HEAD_REF"
          mkdir -p .ci-logs
          cp /tmp/ci.log ".ci-logs/$LOG_NAME"
          git add -f ".ci-logs/$LOG_NAME"
          git commit -q -m "ci: attach failure log $LOG_NAME [skip ci]"
          for i in 1 2 3; do
            if git push -q origin HEAD:"$GITHUB_HEAD_REF"; then break; fi
            git fetch -q origin "$GITHUB_HEAD_REF"
            git rebase -q "origin/$GITHUB_HEAD_REF" || { git rebase --abort; exit 0; }
          done
          {
            echo "### ❌ pr build failed (run ${{ github.run_id }})"
            echo
            echo '```'
            tail -n 50 /tmp/ci.log 2>/dev/null || true
            echo '```'
          } > /tmp/report.md
          jq -n --rawfile body /tmp/report.md '{body: $body}' > /tmp/payload.json
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @/tmp/payload.json || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: app-android/build/outputs/apk/release/app-release-unsigned.apk

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
