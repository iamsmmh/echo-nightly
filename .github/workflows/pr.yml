name: pr build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: { }

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release build (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        # Compiler diagnostics are published as GitHub annotations by ci_run.py
        # instead of being committed back to the PR branch as log files.
        run: python3 scripts/ci_run.py ./gradlew :app-android:assembleRelease :wearApp:assembleRelease --stacktrace

      - name: Resolve APK
        run: python3 scripts/android_artifact.py --variant release --type apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-pr-${{ github.event.pull_request.number || github.run_number }}
          path: app-android/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-pr-build-log
          path: build/verification/
          if-no-files-found: ignore

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
