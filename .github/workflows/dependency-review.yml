name: 'Dependency Review'

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # GitHub's dependency-review-action requires the repository Dependency
    # graph (Settings → Code security). This repo cannot enable that from
    # code, so the job only runs when an admin has set
    # DEPENDENCY_REVIEW_ENABLED=true. Otherwise skip so the PR is not blocked
    # by a platform setting we cannot change here.
    if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
          fail-on-severity: moderate
