name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build common + composeApp (Android targets)
        run: |
          set -o pipefail
          ./gradlew :common:assemble :composeApp:assembleDebug --stacktrace 2>&1 | tee /tmp/ci.log

      - name: Run shared unit tests (commonTest via Android target)
        run: |
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/ci.log

      - name: Build the Android app (regression check)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a /tmp/ci.log

      - name: Report build errors (commit log to branch + PR comment)
        if: failure() && github.event_name == 'pull_request'
        run: |
          # 1) attach the log to the PR branch so it can be inspected offline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "$GITHUB_HEAD_REF" 2>/dev/null || git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/ci.log .ci-last-failure.log || true
          git add -f .ci-last-failure.log
          git commit -q -m "ci: attach failure log [skip ci]" || true
          git push origin "$GITHUB_HEAD_REF" || true
          # 2) also try a PR comment with the digest
          {
            echo "### ❌ ${{ github.workflow }} failed (run ${{ github.run_id }})"
            echo
            echo '```'
            tail -n 60 .ci-last-failure.log 2>/dev/null || true
            echo '```'
          } > /tmp/report.md
          jq -n --rawfile body /tmp/report.md '{body: $body}' > /tmp/payload.json
          curl -s -o /tmp/curl.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @/tmp/payload.json || true
          echo "comment status: $(cat /tmp/curl.out 2>/dev/null)"
      - name: Upload app APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-test-results
          path: composeApp/build/test-results/**/*.xml
