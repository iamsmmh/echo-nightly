name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build common + composeApp (Android targets)
        run: |
          set -o pipefail
          ./gradlew :common:assemble :composeApp:assembleDebug --stacktrace 2>&1 | tee /tmp/ci.log

      - name: Run shared unit tests (commonTest via Android target)
        run: |
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/ci.log

      - name: Build the Android app (regression check)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a /tmp/ci.log

      - name: Report build errors to the PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          {
            echo "### ❌ ${{ github.workflow }} failed (run ${{ github.run_id }})"
            echo
            echo '```'
            grep -hE "^e: |error: |Execution failed for task|Could not|Unresolved reference|problem found" /tmp/ci.log 2>/dev/null | sort -u | head -120 || true
            echo '```'
            echo
            echo "[Full log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > /tmp/report.md
          jq -n --rawfile body /tmp/report.md '{body: $body}' > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @/tmp/payload.json > /dev/null || true

      - name: Upload app APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-test-results
          path: composeApp/build/test-results/**/*.xml
