name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build common + composeApp (Android targets)
        run: |
          # :composeApp uses the AGP KMP library plugin — no variant assemble
          # tasks exist, so build via the lifecycle 'assemble' task.
          python3 scripts/ci_run.py ./gradlew :common:assemble :composeApp:assemble --stacktrace

      - name: Run shared unit tests (commonTest via Android target)
        run: |
          # Discover the Android unit-test task name (varies by AGP/KMP plugin)
          TEST_TASKS=$(./gradlew -q :composeApp:tasks --all 2>/dev/null \
            | grep -oE 'test(Debug|Release)UnitTest' | sort -u || true)
          if [ -n "$TEST_TASKS" ]; then
            echo "Discovered test tasks: $TEST_TASKS"
            python3 scripts/ci_run.py ./gradlew $(echo "$TEST_TASKS" | sed 's|^|:composeApp:|' | tr '\n' ' ') --stacktrace
          else
            echo "::warning::No Android unit-test task found in :composeApp"
            ./gradlew -q :composeApp:tasks --all
          fi

      - name: Build the Android app + Wear OS app (regression check)
        run: |
          python3 scripts/ci_run.py ./gradlew :app-android:assembleDebug :wearApp:assembleDebug --stacktrace

      - name: Run JVM unit tests (shared modules)
        run: |
          # Business-logic + stability-policy unit tests run as plain JVM tests -
          # fast, no emulator, no Robolectric needed.
          python3 scripts/ci_run.py ./gradlew :shared:jvmTest :core:jvmTest :domain:jvmTest :data:jvmTest :extensions:jvmTest :player:jvmTest --stacktrace

      - name: Run Android unit tests (app)
        run: |
          python3 scripts/ci_run.py ./gradlew :app-android:testDebugUnitTest --stacktrace

      - name: Upload app APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-debug
          path: app-android/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Android-test-results
          path: |
            */build/test-results/**/*.xml
            */build/reports/tests/**/*.html
